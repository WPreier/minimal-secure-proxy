[package]
name = "minimal-secure-proxy"
edition = "2021"
version = "0.1.0"
description = "Minimal highly secure reverse proxy with built-in ACME"
license = "MIT OR Apache-2.0"

[dependencies]
# Minimal set – to be refined
tokio = { version = "1", features = ["full"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Further crates only with strong justification and audit

[[bin]]
name = "msp"
path = "src/main.rs"
